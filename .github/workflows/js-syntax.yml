name: JavaScript Syntax Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser bundle
        run: node --check app-bundle.js
      - name: Check boot loader
        run: node --check boot-v7.js
