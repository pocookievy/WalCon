name: Build WalCon App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Bundle application
        run: npx esbuild app-v6.js --bundle --format=esm --platform=browser --outfile=app-bundle.js
      - name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-bundle.js
          if git diff --cached --quiet; then
            echo "No bundle changes"
          else
            git commit -m "Build browser bundle"
            git push
          fi
